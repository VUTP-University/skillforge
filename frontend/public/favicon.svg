<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Window frame -->
  <rect x="1.5" y="1.5" width="21" height="21" rx="3.5" fill="rgba(0,0,0,0.45)" stroke="#5dffa3" stroke-width="1.4" />
  <!-- Titlebar divider -->
  <line x1="1.5" y1="7.25" x2="22.5" y2="7.25" stroke="#5dffa3" stroke-width="1" opacity="0.35" />

  <!-- Traffic-light dots -->
  <circle cx="4.6" cy="4.4" r="1.05" fill="#ff5f56" />
  <circle cx="7.6" cy="4.4" r="1.05" fill="#ffbd2e" />
  <circle cx="10.6" cy="4.4" r="1.05" fill="#27c93f" />

  <!-- ">" prompt chevron -->
  <path d="M5.2 12.4l4 3-4 3" fill="none" stroke="#5dffa3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
  <!-- "_" cursor -->
  <rect x="12.6" y="16.7" width="5.6" height="1.7" rx="0.3" fill="#5dffa3" />
