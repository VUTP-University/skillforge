services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Sofia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  piston:
    image: ghcr.io/engineer-man/piston@sha256:63b5654156a89c5a2ad281aface21416615d62ec056d88efe8fcd307ce73575a
    restart: unless-stopped
    container_name: piston-api
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      # Piston reads PISTON_<OPTION> (see /piston_api/src/config.js) — these are
      # per-request ceilings; each request still passes its own timeout.
      - PISTON_COMPILE_TIMEOUT=60000
      - PISTON_RUN_TIMEOUT=15000
      # Default is 1024 bytes per stdio buffer; going over SIGKILLs the run.
      # Contracts return a compressed per-test report that can exceed that.
      - PISTON_OUTPUT_MAX_SIZE=65536

volumes:
  postgres_data:

networks:
  default:
    name: skillforge_network